services:
  - type: web
    name: nrn-mvp-lab
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: app/NRNConcept
    dockerfilePath: src/NRN.Web/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: HttpsRedirection__Enabled
        value: "false"

  - type: web
    name: nrn-mvp-miniapp
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: app/NRNConcept
    dockerfilePath: src/NRN.Telegram/Dockerfile
    healthCheckPath: /miniapp/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: HttpsRedirection__Enabled
        value: "false"
      - key: PathBase
        value: /miniapp
      - key: ConnectionStrings__NrnServices
        value: Data Source=/app/Data/nrn-telegram.db

  - type: web
    name: nrn-mvp
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: deploy/proxy
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LAB_SCHEME
        value: https
      - key: LAB_HOST
        value: nrn-mvp-lab.onrender.com
      - key: LAB_PORT
        value: "443"
      - key: MINIAPP_SCHEME
        value: https
      - key: MINIAPP_HOST
        value: nrn-mvp-miniapp.onrender.com
      - key: MINIAPP_PORT
        value: "443"
